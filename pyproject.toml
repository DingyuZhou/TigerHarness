[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TigerHarness"
version = "0.3.2"
description = "A generic Claude Code agent harness: iterative task execution, Slack integration, and persistent memory management."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["agent", "claude", "anthropic", "harness", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []  # agent_sdk is now a subpackage; backends are opt-in extras.

[project.optional-dependencies]
slack = [
    "slack-bolt>=1.18,<2.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]
memory = [
    "pyyaml>=6.0",
]
memory-rag = [
    "pyyaml>=6.0",
    "fastembed>=0.4",
    "sqlite-vec>=0.1",
]
memory-rag-openai = [
    "pyyaml>=6.0",
    "openai>=1.0",
    "sqlite-vec>=0.1",
]
# Pulls in Anthropic's official Claude Agent SDK for the anthropic_sdk
# backend. Without this extra, only the `claude_p` (subprocess) backend
# is functional; `get_backend("anthropic_sdk")` raises a clear error
# telling users to install with this extra.
anthropic = [
    "claude-agent-sdk>=0.1.0",
]
all = [
    "slack-bolt>=1.18,<2.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastembed>=0.4",
    "sqlite-vec>=0.1",
    "openai>=1.0",
    "claude-agent-sdk>=0.1.0",
]

[project.scripts]
tigerharness = "tigerharness.cli:main"
tiger-memory = "tigerharness.tiger_memory.cli:main"

[project.urls]
Homepage = "https://github.com/DingyuZhou/TigerHarness"
Repository = "https://github.com/DingyuZhou/TigerHarness"
Issues = "https://github.com/DingyuZhou/TigerHarness/issues"
Changelog = "https://github.com/DingyuZhou/TigerHarness/releases"
Documentation = "https://github.com/DingyuZhou/TigerHarness#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/tigerharness"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "coverage[toml]>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/tigerharness"]
branch = true
omit = [
    # Runnable demo scripts -- they require a live `claude` CLI / API
    # and aren't exercised by the unit-test suite. Keep them in the
    # repo (and the wheel) for users to copy from, but exclude from
    # the coverage gate.
    "src/tigerharness/agent_sdk/examples/*.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
partial_branches = [
    "pragma: no branch",
]
