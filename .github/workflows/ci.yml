# Test CI: runs the suite with the coverage gate exactly as
# pyproject.toml pins it (fail_under owns the floor -- do not restate
# numbers here). No lint step: the project configures no lint tool,
# and CI must not introduce one by drift (T7 scope).
#
# How the matrix interpreter is pinned: `setup-uv`'s `python-version`
# input sets UV_PYTHON, so the later `uv sync` / `uv run` steps resolve
# the matrix version instead of the runner's system Python. That input
# is NOT declared by v3, which this workflow pinned while passing the
# key anyway; it first appears in v4. Check the tag you pin rather than
# trusting that boundary.
#
# The trap that caused that bug, and the reason to check `action.yml`
# before adding any `with:` key here: GitHub Actions silently ignores
# `with:` keys an action does not declare. There is no warning and no
# failure, so a bogus input looks correct forever -- both cells ran
# 3.12.3 for months while the log said `pytest (py3.11)`. Verify a key
# against the pinned tag's own action.yml; release notes are how this
# one got in.
#
# The tag is an exact, immutable version rather than a floating major
# because upstream stopped publishing major/minor tags at v8.0.0 as
# supply-chain hardening (`@v8` and friends do not resolve at all).
# Bumping it also inherits two upstream default changes: `enable-cache`
# is `auto` (it was `false` at v3), and `prune-cache` has defaulted to
# `false` since v9.0.0 -- so this job now caches, and that cache is
# larger. The cache key embeds the `python-version` input, so the two
# matrix cells stay partitioned.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Floor (requires-python >=3.11) and current stable.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (all extras)
        run: uv sync --extra all

      # The bug this workflow carried was not that the wrong interpreter
      # ran -- it is that the wrong interpreter ran for months and every
      # signal, job name included, still looked correct. Pinning the
      # version removes today's instance; this step is what notices the
      # next one. It fails loudly and prints the interpreter that
      # actually ran, so the log localises the drift instead of just
      # going red. The matrix value goes through env rather than being
      # interpolated into the shell command.
      - name: Verify the interpreter matches the matrix cell
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          uv run python -c "import os, sys; expected = os.environ['EXPECTED']; actual = f'{sys.version_info.major}.{sys.version_info.minor}'; assert actual == expected, f'matrix cell says {expected}, interpreter is {sys.version}'"

      - name: Run tests with the coverage gate
        # Plain pytest does NOT enforce the floor (see CONTRIBUTING's
        # trap note) -- the gate only fires with --cov.
        run: uv run pytest --cov=tigerharness --cov-report=term
