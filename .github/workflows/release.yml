# Publishes to PyPI when a version tag is pushed (e.g. `git tag v0.1.4 && git push --tags`).
# Uses OIDC Trusted Publishing — no API token stored as a secret. The publisher
# must be registered once on https://pypi.org/manage/project/tigerharness/settings/publishing/
# with: owner=DingyuZhou, repo=TigerHarness, workflow=release.yml.
name: Release to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
