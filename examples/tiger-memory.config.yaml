# tiger-memory configuration
# Full docs: https://github.com/DingyuZhou/TigerHarness/blob/main/docs/tiger-memory.md
# Design (the three bounded stores + staged compaction, ADR 0007):
#   https://github.com/DingyuZhou/TigerHarness/blob/main/docs/DESIGN-memory.md

agent:
  name: researcher
  role: "A research assistant specializing in technical topics."

store:
  # Where to persist the memory store (the three bounded stores live
  # under <root>/journal/; the rendered session-start briefing under
  # <root>/briefing/). Auto-appends the agent slug.
  root: ~/.local/share/tiger-memory/researcher

sources:
  - kind: claude_code
    # Replace with your actual Claude Code project path.
    # Find yours under ~/.claude/projects/ — the directory name encodes
    # the absolute project path with dashes replacing slashes.
    project_path: ~/.claude/projects/-home-user-myproject/

summarizer:
  # The only registered backend is `anthropic` (a mock exists but is
  # test-internal — reserved for the --mock CLI flag, not registered).
  # Used only by the in-process extraction path; the live subscription
  # path stages prompts for Task sub-agents instead. Vendor-neutral.
  backend: anthropic
  model: claude-sonnet-4-6
  prompts: default/v1

# sweep: team-sweep gating (optional; defaults shown). floor_hours is
# how long after a completed sweep the next trigger is a no-op -- a
# single-operator team may prefer 12 so the evening absorbs the sweep
# instead of the morning's first question.
sweep:
  floor_hours: 24
  max_personas: 3

rebuild:
  lock_path: /tmp/tiger-memory-researcher.lock
  idle_threshold_hours: 1
  rebuild_timeout_minutes: 60

budgets:
  # Max transcript chars fed to a single in-process extraction summarizer
  # call. A transcript over this is clipped (head+tail); the staged
  # sub-agent path owns the reduce of an oversized transcript.
  max_prompt_content_chars: 120000
  # Max transcript chars staged into a sub-agent prompt on the live
  # subscription path (no in-process summarizer there — the sub-agent
  # owns the reduce, so this is sized to its window). Only a transcript
  # beyond this is clipped, as a last resort.
  max_staged_content_chars: 300000

# memory: the three bounded stores (ADR 0007). Every key is optional —
# these are the package defaults; set only the ones you want to tune.
# length_unit is CONFIRMED final (characters, never tokens — tokenization
# is vendor-specific and rejected at load time). Every surface carries a
# two-number bound (max + overflow_limit) giving hysteresis: it may drift
# up to overflow_limit, and only THEN does the sweep stage a compaction
# that shrinks it back below max (prevents thrash). For skills and topics
# the bound is measured over the RENDERED INDEX — the only part loaded at
# session start — plus a per-entry detail bound for each detail file.
memory:
  length_unit: characters
  skills:                     # learned, reusable lessons
    index_max_length: 2000    # the name+trigger index (session-start load)
    index_overflow_limit: 3000
    detail_max_length: 4000   # each skill's procedure detail file
    detail_overflow_limit: 6000
  must_remember:              # external directives; loaded whole
    max_length: 2000
    overflow_limit: 3000
    forget_days: 30           # sweeps TOUCH related items; untouched for N
                              # days: forget-eligible when compaction needs it
  topics:                     # named bodies of durable project knowledge
    index_max_length: 4000    # slug + freshness + summary index (fresh first)
    index_overflow_limit: 6000
    detail_max_length: 4000   # each topic's dated detail body
    detail_overflow_limit: 6000
    fresh_days: 7             # touched within N days: protected from forget/merge
    forget_days: 60           # untouched for N days: forget-eligible
  team_events:                # team-wide event log (ADR 0008): a lazy, dated
                              # who-did-what ledger at <team>/memories/team/
                              # events.md, appended by every persona's sweep
                              # ingest; keep these team-uniform (shared file)
    enabled: true
    recent_days: 30           # daily sections younger than this never compact
    year_after_days: 400      # a month folds into its year this long after year end
    month_max_chars: 1200     # target size of one folded month section
    year_max_chars: 1000      # target size of one folded year section
    max_length: 40000         # size backstop over the FOLDED tiers (month+year
                              # sections only; the daily window is exempt)
    overflow_limit: 50000

# memory_extract: per-section word budgets for the extraction prompt
# (optional; defaults shown). max_output_words caps the whole bundle.
memory_extract:
  skill_procedure_words: 120
  memo_words: 25
  topic_summary_words: 25     # topic index-summary length hint
  topic_detail_words: 80      # per-session topic detail length hint
  team_event_words: 15        # per-EVENT line length hint (team event log)
  max_output_words: 600

# briefing: session-start assembly knobs (optional).
briefing:
