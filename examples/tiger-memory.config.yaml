# tiger-memory configuration
# Full docs: https://github.com/DingyuZhou/TigerHarness/blob/main/docs/tiger-memory.md
# Design (the four bounded stores + meditation):
#   https://github.com/DingyuZhou/TigerHarness/blob/main/docs/DESIGN-memory.md

agent:
  name: researcher
  role: "A research assistant specializing in technical topics."

store:
  # Where to persist the memory store (the four bounded stores +
  # briefing live under journal/ here). Auto-appends the agent slug.
  root: ~/.local/share/tiger-memory/researcher

sources:
  - kind: claude_code
    # Replace with your actual Claude Code project path.
    # Find yours under ~/.claude/projects/ — the directory name encodes
    # the absolute project path with dashes replacing slashes.
    project_path: ~/.claude/projects/-home-user-myproject/

summarizer:
  # Choices: anthropic, mock (for testing without API spend).
  # The summarizer is the ONLY model call: the extraction judgement and
  # meditation's similarity/staleness/compaction judgements. Vendor-neutral.
  backend: anthropic
  model: claude-sonnet-4-6
  prompts: default/v1

rebuild:
  lock_path: /tmp/tiger-memory-researcher.lock
  idle_threshold_hours: 1
  rebuild_timeout_minutes: 60

budgets:
  # Max transcript chars fed to a single in-process extraction summarizer
  # call. A transcript over this is clipped (head+tail); the staged
  # sub-agent path owns the reduce of an oversized transcript.
  max_prompt_content_chars: 120000
  # Max transcript chars staged into a sub-agent prompt on the live
  # subscription path (no in-process summarizer there — the sub-agent
  # owns the reduce, so this is sized to its window). Only a transcript
  # beyond this is clipped, as a last resort.
  max_staged_content_chars: 300000

# memory: the four bounded stores (design §4) + signed-weight decay.
# Every key is optional — these are the package defaults (design §7); set
# only the ones you want to tune. length_unit is CONFIRMED final
# (characters, never tokens — tokenization is vendor-specific and rejected
# at load time). Each store carries a two-number bound (max + overflow_limit)
# giving hysteresis: a store may drift up to overflow_limit, and only THEN
# does meditation fire and compact it back below max (prevents thrash).
memory:
  length_unit: characters
  skills:                  # count-bounded (learned, reusable lessons)
    max_count: 40
    overflow_limit: 50
  must_remember:           # length-bounded chars (external directives)
    max_length: 8000
    overflow_limit: 10000
  diary:                   # length-bounded chars; loaded whole, dated bullets
    max_length: 4000
    overflow_limit: 6000
    weight_cap: 10         # hard cap: |weight| <= 10
    fresh_days: 7          # recents (<= N days) kept verbatim, never fuzzed
    decay:
      magnitude_per_day: 0.1   # how fast |weight| shrinks toward 0
  fuzzy:                   # NEW 4th store: coarsened, grouped older memory
    max_length: 4000       # aged-out diary + must_remember items, re-summarised
    overflow_limit: 6000   # each meditation so it CONVERGES (never grows)

# memory_extract: per-section word budgets for the extraction prompt
# (optional; defaults shown). max_output_words caps the whole bundle.
memory_extract:
  skill_procedure_words: 120
  memo_words: 25
  reaction_words: 40          # diary-note length hint
  max_output_words: 600

# briefing: session-start assembly knobs (optional).
briefing:
