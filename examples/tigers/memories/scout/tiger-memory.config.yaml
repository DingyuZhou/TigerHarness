# tiger-memory config for persona 'scout' (team 'tigers').
# Shared settings (summarizer, rebuild, etc.) are inherited from
# configs/tiger-memory.defaults.yaml. Override any key here to
# customize this persona.
# Docs: https://github.com/DingyuZhou/TigerHarness/blob/main/docs/tiger-memory.md

agent:
  name: scout
  role: "A helpful assistant on team tigers."

store:
  # Memory store lives in this directory (memories/scout/).
  root: .

sources:
  - kind: claude_code
    project_path: /home/tigerleap/.claude/projects/-tmp-claude-1000--home-tigerleap-projects-tiger-teams-Shohoku-3c5f9ba4-d2f3-4841-9c41-75b75280e922-scratchpad-regen-tigers/
    # ^ Where Claude Code WILL write transcripts for this team.
    #   The dir is created on the first claude_p dispatch.
    # Filter: only ingest threads where the bridge stored
    # persona == "scout". Excludes other personas' threads
    # and unattributed local `claude -p` sessions (strict mode).
    persona: scout
  - kind: codex
    # OpenAI Codex sessions (`codex exec`, personas on vendor: chatgpt).
    # `cwd: auto` = only sessions opened in this team root.
    sessions_path: ~/.codex/sessions
    cwd: auto
    persona: scout
  - kind: slack_thread
    # The bridge's per-team state file -- provides the
    # session_id -> (thread_ts, persona) reverse map used
    # by the per-persona filters above.
    threads_json: ~/.local/state/slack-bridge/tigers/threads.json
rebuild:
  lock_path: /tmp/tiger-memory-tigers-scout.lock
