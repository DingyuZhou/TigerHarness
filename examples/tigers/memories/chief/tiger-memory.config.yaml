# tiger-memory config for persona 'chief' (team 'tigers').
# Docs: https://github.com/DingyuZhou/TigerHarness/blob/main/docs/tiger-memory.md

agent:
  name: chief
  role: "A helpful assistant on team tigers."

store:
  # Memory store lives in this directory (memories/chief/).
  root: .

sources:
  - kind: claude_code
    project_path: ~/.claude/projects/-home-user-myproject/
    # ^ Replace with your Claude Code project path.
    #   Find yours under ~/.claude/projects/ -- the directory name
    #   encodes the absolute project path with dashes replacing slashes.
  - kind: journal_worklog
    # Per-persona journal memory: ingest the worklog entries THIS persona
    # ('chief') personally wrote during journal drives -- not the
    # driver's. One memory per (task, persona). See
    # docs/per-persona-journal-memory.md.
    journal_root: ../../journal/
    # ^ The team's journal/ directory. A relative path is anchored to this
    #   config file's directory; use an absolute path for a headless sweep
    #   launched from an arbitrary working directory.
    persona: chief
    # team: tigers   # optional; defaults to the journal root's parent dir
summarizer:
  backend: anthropic
  model: claude-sonnet-4-6
  prompts: default/v1

rebuild:
  lock_path: /tmp/tiger-memory-tigers-chief.lock
  idle_threshold_hours: 1
  resummarize_window_days: 7
  rebuild_timeout_minutes: 60
