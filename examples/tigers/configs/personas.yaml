# Team: tigers
# Personas registry for tigerharness (journal, slack-bridge).
#
# Load this file by pointing the env var at it (absolute or relative path):
#     export TIGERHARNESS_PERSONAS_CONFIG=path/to/tigers/configs/personas.yaml
#
# `personas_dir`, `cwd`, and `extra.add_dirs` are resolved relative to
# THIS FILE'S directory, not your cwd at load time, so the team folder
# can be moved or invoked from anywhere.
#
# Convention used by `tigerharness init`:
#   - `personas_dir: ../personas` -- prompts live next to this folder
#   - `cwd: ..` on every persona  -- agents run from the team root
#   - uncomment `extra.add_dirs: [../skills]` to expose team skills
# Schema: top-level `personas_dir` + `personas:` list; each entry has
# `name`, optional `aliases`, `cwd` (relative to this file), and
# `prompt_file` (relative to personas_dir, `.md` appended).

personas_dir: ../personas

# Team default model vendor + model. Every persona runs on these unless
# its own entry sets `vendor:` / `model:` (see the commented hints on
# each entry). Vendors: `claude` runs `claude -p` (Claude Code);
# `chatgpt` runs `codex exec` (OpenAI Codex). A blank model means the
# vendor CLI's own default model; a persona inherits `default_model`
# only while it is on the team's `default_vendor` (a model id belongs
# to one vendor). Read by the Slack bridge (per persona), autodrive (one
# drive per vendor/model lane with work, ADR 0012 -- not just its
# --driver), and idle compaction.
default_vendor: claude
default_model: ""

personas:
  - name: chief
    cwd: ..
    prompt_file: chief/prompt
    description: "chief on team tigers"
    # vendor: default   # claude | chatgpt | default (the team's default_vendor)
    # model: default    # a model id, or default (= default_model while on the team's vendor, else the vendor CLI's own)
    # extra:
    #   add_dirs: [../skills]   # uncomment to expose team-shared skills
  - name: scout
    cwd: ..
    prompt_file: scout/prompt
    description: "scout on team tigers"
    # vendor: chatgpt   # this persona runs on `codex exec` instead
    # model: default    # a model id, or default (= default_model while on the team's vendor, else the vendor CLI's own)
    # extra:
    #   add_dirs: [../skills]   # uncomment to expose team-shared skills
